version: '3.8'
services:
  web:
    build: .
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./uploads:/var/www/html/uploads
      - ./exports:/var/www/html/exports
    environment:
      - TTN_MODE=simulation
      - TTN_TOKEN=${TTN_TOKEN}
      - TTN_LOGIN=${TTN_LOGIN}
      - TTN_PASS=${TTN_PASS}
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: facture_electronique
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
volumes:
  db_data:
